<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>US GDP by Year</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; color: #172033; }
    h1 { margin-bottom: .25rem; }
    .subtitle { color: #596579; margin-top: 0; }
    svg { width: 100%; height: auto; border: 1px solid #dbe2ea; border-radius: 10px; background: #fbfcfe; }
    .grid { stroke: #dbe2ea; stroke-width: 1; }
    .axis { fill: #596579; font-size: 12px; }
    .line { fill: none; stroke: #2368d1; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #2368d1; stroke: white; stroke-width: 2; }
    .note { font-size: .9rem; color: #596579; }
  </style>
</head>
<body>
  <h1>United States GDP by Year</h1>
  <p class="subtitle">GDP in current US dollars, 1960–2025</p>
  <svg id="chart" viewBox="0 0 1000 560" role="img" aria-label="Line chart of United States GDP by year"></svg>
  <p class="note">Source: World Bank indicator NY.GDP.MKTP.CD. Current-dollar values are not inflation-adjusted.</p>
  <script>
    const rows = [
      [1960,541988586207],[1961,561940310345],[1962,603639413793],[1963,637058551724],
      [1964,684144620690],[1965,741904862069],[1966,813032758621],[1967,859620034483],
      [1968,940225000000],[1969,1017438172414],[1970,1073303000000],[1971,1164850000000],
      [1972,1279110000000],[1973,1425376000000],[1974,1545243000000],[1975,1684904000000],
      [1976,1873412000000],[1977,2081826000000],[1978,2351599000000],[1979,2627333000000],
      [1980,2857307000000],[1981,3207041000000],[1982,3343789000000],[1983,3634038000000],
      [1984,4037613000000],[1985,4338979000000],[1986,4579631000000],[1987,4855215000000],
      [1988,5236438000000],[1989,5641580000000],[1990,5963144000000],[1991,6158129000000],
      [1992,6520327000000],[1993,6858559000000],[1994,7287236000000],[1995,7639749000000],
      [1996,8073122000000],[1997,8577552000000],[1998,9062817000000],[1999,9631172000000],
      [2000,10250952000000],[2001,10581929000000],[2002,10929108000000],[2003,11456450000000],
      [2004,12217196000000],[2005,13039197000000],[2006,13815583000000],[2007,14474228000000],
      [2008,14769862000000],[2009,14478067000000],[2010,15048971000000],[2011,15599732000000],
      [2012,16253970000000],[2013,16880683000000],[2014,17608138000000],[2015,18295019000000],
      [2016,18804913000000],[2017,19612102000000],[2018,20656516000000],[2019,21539982000000],
      [2020,21375281000000],[2021,23725645000000],[2022,26054614000000],[2023,27811517000000],
      [2024,29298013000000],[2025,30769700000000]
    ];
    const svg = document.querySelector("#chart"), ns = "http://www.w3.org/2000/svg";
    const W=1000,H=560, pad={l:78,r:24,t:24,b:58}, max=32e12;
    const x = year => pad.l + (year-1960)/(2025-1960)*(W-pad.l-pad.r);
    const y = value => H-pad.b - value/max*(H-pad.t-pad.b);
    const add = (tag, attrs, text="") => {
      const e=document.createElementNS(ns,tag); Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
      e.textContent=text; svg.appendChild(e); return e;
    };
    for (let v=0; v<=30; v+=5) {
      add("line",{x1:pad.l,x2:W-pad.r,y1:y(v*1e12),y2:y(v*1e12),class:"grid"});
      add("text",{x:pad.l-10,y:y(v*1e12)+4,"text-anchor":"end",class:"axis"},`$${v}T`);
    }
    [1960,1970,1980,1990,2000,2010,2020,2025].forEach(year =>
      add("text",{x:x(year),y:H-pad.b+28,"text-anchor":"middle",class:"axis"},year));
    add("path",{d:rows.map(([year,value],i)=>(i?"L":"M")+`${x(year)},${y(value)}`).join(" "),class:"line"});
    rows.forEach(([year,value]) => add("circle",{cx:x(year),cy:y(value),r:4,class:"dot",
      tabindex:"0","aria-label":`${year}: $${(value/1e12).toFixed(2)} trillion`}));
    add("text",{x:W/2,y:H-12,"text-anchor":"middle",class:"axis"},"Year");
    add("text",{x:18,y:H/2,transform:`rotate(-90 18 ${H/2})`,"text-anchor":"middle",class:"axis"},"GDP (current US$)");
  </script>
</body>
</html>
